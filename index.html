<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#3b3f7a" />
    <title>猜猜我有多爱你</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="./fonts/wenkai.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./spreads/capa.webp" as="image" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"><div class="stars"></div><div class="stars"></div></div>

    <main>
      <div id="stage" aria-label="猜猜我有多爱你"></div>
      <p id="hint"></p>
      <nav class="controls">
        <button id="prev" type="button" class="nav-btn">‹</button>
        <span id="counter" aria-live="polite"></span>
        <button id="next" type="button" class="nav-btn">›</button>
      </nav>
    </main>

    <div id="secret" hidden>
      <canvas id="fireworks"></canvas>
      <button id="close" type="button"></button>
    </div>

    <!-- filtros de aquarela usados pelas figurinhas -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="wc" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4" />
        <feDisplacementMap in="SourceGraphic" scale="5" />
        <feGaussianBlur stdDeviation="0.6" />
      </filter>
      <filter id="ink">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="7" />
        <feDisplacementMap in="SourceGraphic" scale="1.8" />
      </filter>
      <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="11" />
        <feDisplacementMap in="SourceGraphic" scale="22" />
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </svg>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
